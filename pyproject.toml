[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghosla"
version = "0.1.0"
description = "Personal Workbench & Atelier for Agent Instructions and Skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
ghosla = "ghosla.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "upstream",
    "skills",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["^upstream/", "^skills/"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
